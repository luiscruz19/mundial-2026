# ════════════════════════════════════════════════════════════════════════════
#  MUNDIAL 2026 · PROD (test server) — backend (API). Build+push + runtime.
#  - `deploy.sh test` lo usa para BUILD + PUSH de la imagen a GHCR.
#  - En el server se usa el mismo archivo para PULL + UP (el bloque build: es inerte
#    al hacer pull/up con la imagen ya publicada; nada se compila en el server).
#  Infra compartida (Traefik, mysql_db, redis, minio) provista por /opt/shared en la
#  red externa net-shared. Mundial es device-anónimo: el dominio entero rutea a la API.
#  Variables runtime en .env (no versionado).
# ════════════════════════════════════════════════════════════════════════════
services:
  mundial_api:
    build:
      context: ./api
      dockerfile: Dockerfile.production
    image: ghcr.io/luiscruz19/mundial-api:${TAG:-TEST}
    container_name: mundial_api
    restart: unless-stopped
    # Opcional: en build/push local no hace falta; en el server (.env presente) se carga.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=net-shared"
      - "traefik.http.routers.mundial_api.rule=Host(`mundial.sda.ovh`)"
      - "traefik.http.routers.mundial_api.priority=10"
      - "traefik.http.services.mundial_api.loadbalancer.server.port=80"
    networks:
      - net-shared

networks:
  net-shared:
    external: true
