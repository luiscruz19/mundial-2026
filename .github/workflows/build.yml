# CI: construye la imagen de producción del backend y la publica en GHCR con tag TEST.
# Equivalente al .gitlab-ci.yml del patrón, pero nativo de GitHub (push a ghcr.io).
# El GITHUB_TOKEN lo inyecta GitHub solo; con permission packages:write alcanza para pushear a GHCR.
name: build

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (api → ghcr.io/<owner>/mundial-api:TEST)
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile.production
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mundial-api:TEST
