# CI: construye la imagen de producción del backend y la publica en GHCR con tag TEST.
# Usa docker "crudo" (login/build/push), como el .gitlab-ci.yml del patrón, para no
# depender de actions de terceros (docker/*) que la política del repo podría bloquear.
# El GITHUB_TOKEN lo inyecta GitHub; con permission packages:write alcanza para pushear a GHCR.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build & push (api → ghcr.io/<owner>/mundial-api:TEST)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          set -e
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/mundial-api:TEST"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build -f api/Dockerfile.production -t "$IMAGE" ./api
          docker push "$IMAGE"
